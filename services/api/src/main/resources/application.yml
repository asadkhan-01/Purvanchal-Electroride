server:
  port: ${PORT:8080}

spring:
  mvc:
    # RFC 9457 bodies: deliberate business-rule reasons reach the client as `detail`;
    # unexpected exceptions still return a generic error without internal messages.
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electroride}}
    username: ${DB_USER:electroride}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Development bootstrap only: creates an initial admin if app_users is empty.
# Provide these via environment variables, never in committed files.
app:
  bootstrap:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:}
  # Printed on every branch's invoice (same GSTIN and mobile for all branches).
  dealer:
    gstin: 09ACZPM2545H1ZO
    phone: "9695551902"
