services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: electroride
      POSTGRES_USER: electroride
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - electroride_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electroride -d electroride"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  electroride_pgdata:
